services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sonlokma
      POSTGRES_USER: sonlokma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "sonlokma", "-d", "sonlokma"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  backend:
    build: ./backend
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "3000"
      DATABASE_URL: "postgresql://sonlokma:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}@db:5432/sonlokma"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(async r => process.exit(r.ok && (await r.json()).status === 'ok' ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 20s

volumes:
  postgres_data:
