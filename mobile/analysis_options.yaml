include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  errors:
    invalid_annotation_target: ignore # freezed + json_key
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_print # debugPrint kullan
    - cancel_subscriptions
    - prefer_const_constructors
    - prefer_final_locals
    - unawaited_futures
    - use_build_context_synchronously
