name: sonlokma
description: SonLokma - kampüs sürpriz paket pazar yeri
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  flutter_secure_storage: ^9.2.2
  freezed_annotation: ^3.0.0
  json_annotation: ^4.12.0
  uuid: ^4.5.1
  intl: ^0.20.3 # flutter_localizations ile aynı sürüm olmalı
  google_maps_flutter: ^2.10.0 # ClusterManager (yerleşik clustering) 2.9+ ile geldi
  geolocator: ^13.0.2
  webview_flutter: ^4.10.0
  qr_flutter: ^4.1.0
  screen_brightness: ^1.0.1
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  fake_async: ^1.3.1
  build_runner: ^2.5.0
  freezed: ^3.0.0
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true
