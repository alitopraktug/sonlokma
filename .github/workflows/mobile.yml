
name: mobile

on:
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Check mobile project
        id: project
        working-directory: .
        shell: bash
        run: |
          if [ -f mobile/pubspec.yaml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [ -d mobile ]; then
            echo "::error::mobile/pubspec.yaml is missing"
            exit 1
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Mobile project has not been initialized yet."
          fi

      - uses: subosito/flutter-action@v2
        if: steps.project.outputs.exists == 'true'
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true

      - name: Install dependencies
        if: steps.project.outputs.exists == 'true'
        run: flutter pub get

      - name: Generate freezed / json_serializable code
        if: steps.project.outputs.exists == 'true'
        timeout-minutes: 5
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        if: steps.project.outputs.exists == 'true'
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        if: steps.project.outputs.exists == 'true'
        run: flutter test --coverage

      - uses: actions/upload-artifact@v4
        if: always() && steps.project.outputs.exists == 'true'
        with:
          name: mobile-coverage
          path: mobile/coverage/lcov.info
          if-no-files-found: warn
