name: mobile

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # android/ios klasörleri henüz repoda yok; derleme için geçici olarak üretilir.
      # flutter create mevcut dosyaları ezmez, sadece eksikleri ekler.
      - name: Generate platform folders
        run: |
          flutter create --org com.sonlokma --project-name sonlokma --platforms android,ios .
          rm -f test/widget_test.dart

      - run: flutter pub get

      - name: Generate freezed / json_serializable code
        run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter analyze --no-fatal-infos

      - run: flutter test --coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: mobile/coverage/lcov.info
          if-no-files-found: ignore
